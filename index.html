<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacman By ZinYeuChuot</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="game-container">
      <div class="header">
        <div id="score-text">SCORE<br /><span id="score">0</span></div>
        <div id="high-score-text">
          HIGH SCORE<br /><span id="high-score">0</span>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="420"></canvas>

      <div id="game-over" class="hidden">
        <h2>GAME OVER</h2>
        <p>Nhấn phím SPACE để chơi lại</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
